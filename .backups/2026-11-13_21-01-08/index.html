<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смета за 5 минут</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">ПРОСТО О ДЕЛАХ</p>
      <h1>Смета за 5 минут</h1>
      <p class="hint">Добавь позиции и цены — суммы посчитаются сами.</p>
    </header>
    <h1 id="print-title" class="print-only"></h1>

    <section class="card" aria-labelledby="details-heading">
      <h2 id="details-heading">Реквизиты</h2>
      <div class="details-grid">
        <label>От кого<input type="text" name="sender" placeholder="Имя или название компании"></label>
        <label>Для кого<input type="text" name="recipient" placeholder="Клиент или организация"></label>
        <label>Номер сметы<input type="text" name="estimate-number" placeholder="Например, 001"></label>
        <label>Дата<input type="date" name="estimate-date" id="estimate-date"></label>
      </div>
    </section>

    <section class="card positions-card" aria-labelledby="positions-heading">
      <div class="section-heading">
        <h2 id="positions-heading">Позиции</h2>
        <p class="keyboard-hint" id="keyboard-hint">Enter в последней строке добавит новую</p>
      </div>
      <table aria-labelledby="positions-heading" aria-describedby="keyboard-hint">
        <thead>
          <tr><th scope="col">Наименование</th><th scope="col">Количество</th><th scope="col">Единица</th><th scope="col">Цена, <span class="currency-mark">₸</span></th><th scope="col" class="money-heading">Сумма</th><th scope="col"><span class="sr-only">Удаление</span></th></tr>
        </thead>
        <tbody id="positions"></tbody>
      </table>
      <button type="button" id="add-position" class="add-button">+ Добавить позицию</button>
      <div class="adjustments-grid">
        <label>Скидка, %<input type="text" id="discount-percent" inputmode="decimal" value="0" autocomplete="off"></label>
        <label>НДС, %<input type="text" id="vat-percent" inputmode="decimal" value="0" autocomplete="off"></label>
        <label>Валюта<select id="currency"><option value="₸">₸</option><option value="₽">₽</option><option value="$">$</option><option value="€">€</option></select></label>
      </div>
    </section>

    <section class="card summary-card" aria-label="Расчёт итога">
      <dl class="summary-list">
        <div><dt>Сумма</dt><dd><output id="subtotal">0 ₸</output></dd></div>
        <div id="discount-summary" hidden><dt>Скидка</dt><dd><output id="discount-amount">0 ₸</output></dd></div>
        <div id="discounted-summary" hidden><dt>Сумма со скидкой</dt><dd><output id="discounted-total">0 ₸</output></dd></div>
        <div id="vat-summary" hidden><dt>НДС</dt><dd><output id="vat-amount">0 ₸</output></dd></div>
      </dl>
    </section>

    <section class="total-card" aria-labelledby="total-heading">
      <h2 id="total-heading">Итого к оплате</h2>
      <output id="grand-total" aria-live="polite" aria-atomic="true">0 ₸</output>
    </section>

    <section class="card comment-card" aria-labelledby="comment-heading">
      <h2 id="comment-heading"><label for="comment">Комментарий</label></h2>
      <textarea id="comment" name="comment" rows="4" placeholder="Сроки выполнения, условия оплаты и другие договорённости"></textarea>
    </section>
    <p class="print-only signature">Подпись ____________________</p>
    <div class="print-actions">
      <button type="button" id="new-estimate" class="secondary-button">Новая смета</button>
      <button type="button" id="copy-whatsapp" class="secondary-button">Скопировать для WhatsApp</button>
      <button type="button" id="save-pdf">Сохранить PDF</button>
    </div>
    <p id="copy-status" class="action-status" role="status"></p>
    <p id="storage-status" class="action-status" role="status"></p>
    <section id="manual-copy" class="card" hidden>
      <label for="share-text">Скопируй текст вручную</label>
      <textarea id="share-text" rows="8" readonly></textarea>
    </section>
  </main>

  <template id="position-template">
    <tr class="position-row">
      <td><label><span class="mobile-label">Наименование</span><input type="text" class="position-name" aria-label="Наименование" placeholder="Товар или услуга"></label></td>
      <td><label><span class="mobile-label">Количество</span><input type="text" class="quantity" inputmode="decimal" aria-label="Количество" placeholder="0" autocomplete="off"></label></td>
      <td><label><span class="mobile-label">Единица</span><select class="unit" aria-label="Единица"><option value="шт">шт</option><option value="час">час</option><option value="услуга">услуга</option></select></label></td>
      <td><label><span class="mobile-label">Цена, <span class="currency-mark">₸</span></span><input type="text" class="price" inputmode="decimal" aria-label="Цена, ₸" placeholder="0" autocomplete="off"></label></td>
      <td class="row-total-cell"><span class="mobile-label">Сумма</span><output class="row-total" aria-label="Сумма строки">0 ₸</output></td>
      <td class="remove-cell"><button type="button" class="remove-button" aria-label="Удалить позицию" title="Удалить позицию">✕</button></td>
    </tr>
  </template>
</body>
</html>
